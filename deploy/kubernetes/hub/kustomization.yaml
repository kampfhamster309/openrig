# The hub pod (pod hub-0): an OpenRig daemon with no rigs, the operator's one point of truth.
# Apply the shared objects first:
#   kubectl apply -k deploy/kubernetes && kubectl apply -k deploy/kubernetes/hub
# Needs nothing beyond the ghcr-pull Secret: the hub holds no agent credentials and no bearer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openrig
resources:
  - service.yaml
  - statefulset.yaml
images:
  - name: openrig-host
    newName: ghcr.io/kampfhamster309/openrig-host
    newTag: 0.7.1-f1b1a20c2
