# kubectl apply -k deploy/kubernetes
# Create the Secrets first (see README.md); they are not in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openrig
resources:
  - manifests/namespace.yaml
  - manifests/service.yaml
  - manifests/statefulset.yaml
  - manifests/networkpolicy.yaml
  - manifests/teams-service.yaml
images:
  - name: openrig-host
    newName: ghcr.io/kampfhamster309/openrig-host
    newTag: 0.6.10-f06e626b4-dirty-202610231150
configMapGenerator:
  # Flat keys; the StatefulSet's volume items lay them out as /etc/openrig-kit/<path>.
  - name: openrig-kit
    files:
      - rig.yaml=kit/rig.yaml
      - lead-monitoring.md=kit/guidance/lead-monitoring.md
      - pi-seat-status=kit/bin/pi-seat-status
      - openrig-heartbeat.ts=kit/pi-extensions/openrig-heartbeat.ts
      - models.json=kit/pi/models.json
generatorOptions:
  # The kit is read at boot (Pi seeding) and at `rig up`; a kit edit should not restart the team.
  disableNameSuffixHash: true
